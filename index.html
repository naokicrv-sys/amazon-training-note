<script>
// PIN protection - runs before React loads
(function(){
  const STORAGE_KEY='dsn_pin_ok';
  const CORRECT='0321'; // change this PIN
  if(sessionStorage.getItem(STORAGE_KEY)==='1')return;
  document.addEventListener('DOMContentLoaded',function(){
    const overlay=document.createElement('div');
    overlay.id='pin-overlay';
    overlay.innerHTML=`<div style="position:fixed;inset:0;background:#1e3a5f;display:flex;align-items:center;justify-content:center;z-index:9999;flex-direction:column;gap:16px;font-family:-apple-system,sans-serif">
      <div style="color:#fff;font-size:22px;font-weight:800;letter-spacing:1px">📋 AMAZON<br>トレーニングノート</div>
      <div style="color:#93c5fd;font-size:14px;margin-bottom:8px">PINを入力してください</div>
      <input id="pin-input" type="password" inputmode="numeric" maxlength="4" pattern="[0-9]*"
        style="width:160px;padding:14px;border-radius:10px;border:2px solid #3b82f6;font-size:28px;text-align:center;letter-spacing:12px;background:#fff;color:#1e293b;outline:none"
        placeholder="••••"/>
      <div id="pin-error" style="color:#ef4444;font-size:13px;min-height:20px"></div>
      <button id="pin-btn" style="padding:12px 32px;background:#3b82f6;color:#fff;border:none;border-radius:10px;font-size:16px;font-weight:700;cursor:pointer">ログイン</button>
    </div>`;
    document.body.appendChild(overlay);
    const input=document.getElementById('pin-input');
    const btn=document.getElementById('pin-btn');
    const err=document.getElementById('pin-error');
    function tryPin(){
      if(input.value===CORRECT){sessionStorage.setItem(STORAGE_KEY,'1');overlay.remove()}
      else{err.textContent='PINが違います。もう一度入力してください。';input.value='';input.focus()}
    }
    btn.addEventListener('click',tryPin);
    input.addEventListener('keydown',e=>{if(e.key==='Enter')tryPin()});
    input.addEventListener('input',e=>{if(e.target.value.length===4)tryPin()});
    setTimeout(()=>input.focus(),100);
  });
})();
</script>

function NotesTab({notes,setNotes,setPhrases}){
  const [view,setView]=useState('list');// list|form|detail
  const [editing,setEditing]=useState(null);
  const [detail,setDetail]=useState(null);
  const [filter,setFilter]=useState('');
  const [catFilter,setCatFilter]=useState('');
  const [uFilter,setUFilter]=useState('');
  const [favOnly,setFavOnly]=useState(false);

  const emptyNote={id:'',category:'Safety',term:'',title:'',summary:'',fieldMeaning:'',checkPoints:'',abnormalResponse:'',usefulPhrase:'',relatedLP:'',experienceNote:'',understanding:3,nextCheck:'',favorite:false};

  const filtered = useMemo(()=>notes.filter(n=>{
    if(favOnly&&!n.favorite)return false;
    if(catFilter&&n.category!==catFilter)return false;
    if(uFilter&&n.understanding!==parseInt(uFilter))return false;
    const kw=filter.toLowerCase();
    if(!kw)return true;
    return [n.term,n.title,n.summary,n.fieldMeaning,n.usefulPhrase,n.experienceNote].some(f=>f&&f.toLowerCase().includes(kw));
  }),[notes,filter,catFilter,uFilter,favOnly]);

  const save2=(form)=>{
    const now=new Date().toISOString();
    if(form.id){
      setNotes(prev=>prev.map(n=>n.id===form.id?{...form,updatedAt:now}:n));
    } else {
      const nn={...form,id:uid(),createdAt:now,updatedAt:now};
      setNotes(prev=>[nn,...prev]);
      // extract phrase
      if(nn.usefulPhrase){
        setPhrases(prev=>[{id:uid(),phrase:nn.usefulPhrase,category:nn.category,scene:'ノートより',relatedLP:'',favorite:false,sourceId:nn.id,sourceType:'note'},...prev]);
      }
    }
    setView('list');setEditing(null);
  };

  const del=(id)=>{if(window.confirm('削除しますか？'))setNotes(prev=>prev.filter(n=>n.id!==id));};
  const toggleFav=(id)=>setNotes(prev=>prev.map(n=>n.id===id?{...n,favorite:!n.favorite}:n));

  if(view==='form') return <NoteForm initial={editing||emptyNote} onSave={save2} onCancel={()=>{setView('list');setEditing(null)}}/>;
  if(view==='detail'&&detail) return <NoteDetail note={detail} onEdit={()=>{setEditing(detail);setView('form')}} onBack={()=>{setView('list');setDetail(null)}} onDel={()=>{del(detail.id);setView('list');setDetail(null)}} onFav={()=>{toggleFav(detail.id);setDetail(prev=>({...prev,favorite:!prev.favorite}))}}/>;

  return <div className="page">
    <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:10}}>
      <div className="section-title" style={{marginBottom:0}}>📒 ノート</div>
      <button className="btn btn-primary btn-sm" onClick={()=>{setEditing(null);setView('form')}}>＋ 追加</button>
    </div>
    <div className="search-box">
      <span className="search-icon">🔍</span>
      <input placeholder="キーワード検索..." value={filter} onChange={e=>setFilter(e.target.value)}/>
    </div>
    <div className="tab-scroll">
      <button className={`tab-btn${catFilter===''?' active':''}`} onClick={()=>setCatFilter('')}>すべて</button>
      {CATS.map(c=><button key={c} className={`tab-btn${catFilter===c?' active':''}`} onClick={()=>setCatFilter(c)}>{c}</button>)}
    </div>
    <div style={{display:'flex',gap:8,marginBottom:10,flexWrap:'wrap'}}>
      <select style={{width:'auto',flex:1}} value={uFilter} onChange={e=>setUFilter(e.target.value)}>
        <option value="">理解度 全て</option>
        {[1,2,3,4,5].map(i=><option key={i} value={i}>★{i}</option>)}
      </select>
      <button className={`btn btn-sm ${favOnly?'btn-primary':'btn-gray'}`} onClick={()=>setFavOnly(!favOnly)}>⭐ お気に入り</button>
    </div>
    <div style={{fontSize:12,color:'var(--gray)',marginBottom:8}}>{filtered.length}件</div>
    {filtered.length===0&&<div className="empty"><div className="empty-icon">📒</div>ノートがありません</div>}
    {filtered.map(n=><div key={n.id} className="note-card">
      <div className="top">
        <div>
          <Badge text={n.category}/>
          <div className="note-title">{n.term||n.title}</div>
        </div>
        <div style={{display:'flex',gap:4,alignItems:'center'}}>
          <button style={{background:'none',border:'none',cursor:'pointer',fontSize:18,color:n.favorite?'#f59e0b':'#d1d5db'}} onClick={()=>toggleFav(n.id)}>★</button>
        </div>
      </div>
      <div className="note-summary">{n.summary}</div>
      <div className="understanding-bar">
        {[1,2,3,4,5].map(i=><div key={i} className={`u-dot${i<=n.understanding?' filled':''}`}/>)}
        <span style={{fontSize:11,color:'var(--gray)',marginLeft:4}}>理解度{n.understanding}</span>
      </div>
      {n.usefulPhrase&&<div className="note-phrase">「{n.usefulPhrase}」</div>}
      <div className="action-row">
        <button className="btn btn-outline btn-sm" onClick={()=>{setDetail(n);setView('detail')}}>詳細</button>
        <button className="btn btn-gray btn-sm" onClick={()=>{setEditing(n);setView('form')}}>編集</button>
        <button className="btn btn-danger btn-sm" onClick={()=>del(n.id)}>削除</button>
        {n.usefulPhrase&&<CopyBtn text={n.usefulPhrase} label="一言コピー"/>}
      </div>
    </div>)}
  </div>;
}

function QATab({qa,setQA,notes}){
  const [mode,setMode]=useState('list');// list|review|form
  const [editing,setEditing]=useState(null);
  const [reviewIdx,setReviewIdx]=useState(0);
  const [showAns,setShowAns]=useState(false);
  const [filter,setFilter]=useState('');
  const [catFilter,setCatFilter]=useState('');
  const [reviewFilter,setReviewFilter]=useState('all');// all|low|fav

  const emptyQA={id:'',question:'',answer:'',category:'数字',understanding:3,favorite:false,relatedNoteId:''};

  const filtered = useMemo(()=>qa.filter(q=>{
    if(catFilter&&q.category!==catFilter)return false;
    const kw=filter.toLowerCase();
    if(!kw)return true;
    return [q.question,q.answer].some(f=>f&&f.toLowerCase().includes(kw));
  }),[qa,filter,catFilter]);

  const reviewList = useMemo(()=>{
    let list=[...qa];
    if(reviewFilter==='low')list=list.filter(q=>q.understanding<=2);
    if(reviewFilter==='fav')list=list.filter(q=>q.favorite);
    return list.sort(()=>Math.random()-.5);
  },[qa,reviewFilter]);

  const saveQA=(f)=>{
    const now=new Date().toISOString();
    if(f.id){setQA(p=>p.map(q=>q.id===f.id?{...f,updatedAt:now}:q))}
    else{setQA(p=>[{...f,id:uid(),createdAt:now,updatedAt:now},...p])}
    setMode('list');setEditing(null);
  };

  const evalQA=(idx,score)=>{
    const item=reviewList[idx];
    setQA(p=>p.map(q=>q.id===item.id?{...q,understanding:Math.max(1,Math.min(5,score)),lastReviewed:new Date().toISOString()}:q));
    setShowAns(false);
    setReviewIdx(i=>Math.min(i+1,reviewList.length-1));
  };

  if(mode==='form') return <div className="page">
    <div style={{display:'flex',justifyContent:'space-between',marginBottom:12}}>
      <div className="section-title" style={{marginBottom:0}}>{editing?.id?'Q&A編集':'新規Q&A'}</div>
      <button className="btn btn-gray btn-sm" onClick={()=>{setMode('list');setEditing(null)}}>← 戻る</button>
    </div>
    <div className="card">
      <label>カテゴリ</label>
      <select value={editing?.category||'数字'} onChange={e=>setEditing(p=>({...p,category:e.target.value}))}>{CATS.map(c=><option key={c}>{c}</option>)}</select>
      <label>質問 *</label>
      <textarea placeholder="例：Backlogが増えた時に最初に確認することは？" value={editing?.question||''} onChange={e=>setEditing(p=>({...p,question:e.target.value}))}/>
      <label>回答 *</label>
      <textarea style={{minHeight:100}} placeholder="回答を入力" value={editing?.answer||''} onChange={e=>setEditing(p=>({...p,answer:e.target.value}))}/>
      <label>理解度</label>
      <StarRating value={editing?.understanding||3} onChange={v=>setEditing(p=>({...p,understanding:v}))}/>
      <div style={{marginTop:10}}>
        <label style={{display:'flex',alignItems:'center',gap:8}}>
          <input type="checkbox" checked={editing?.favorite||false} onChange={e=>setEditing(p=>({...p,favorite:e.target.checked}))}/> お気に入り
        </label>
      </div>
    </div>
    <button className="btn btn-primary" style={{width:'100%'}} onClick={()=>{if(!editing?.question){alert('質問を入力');return};saveQA(editing||emptyQA)}}>保存</button>
  </div>;

  if(mode==='review') return <div className="page">
    <div style={{display:'flex',justifyContent:'space-between',marginBottom:12}}>
      <div className="section-title" style={{marginBottom:0}}>🎯 復習モード</div>
      <button className="btn btn-gray btn-sm" onClick={()=>{setMode('list');setReviewIdx(0)}}>終了</button>
    </div>
    <div style={{display:'flex',gap:6,marginBottom:12}}>
      {['all','low','fav'].map(t=><button key={t} className={`btn btn-sm ${reviewFilter===t?'btn-primary':'btn-gray'}`} onClick={()=>{setReviewFilter(t);setReviewIdx(0);setShowAns(false)}}>
        {t==='all'?'全て':t==='low'?'苦手':' ⭐ お気に入り'}
      </button>)}
    </div>
    {reviewList.length===0?<div className="empty"><div className="empty-icon">🎯</div>Q&Aがありません</div>:<>
      <div style={{fontSize:13,color:'var(--gray)',marginBottom:8}}>{reviewIdx+1} / {reviewList.length}</div>
      <div className="review-card">
        <div className="review-q">{reviewList[reviewIdx].question}</div>
        {!showAns?<button className="btn btn-primary" style={{width:'100%'}} onClick={()=>setShowAns(true)}>回答を見る</button>:<>
          <div className="review-a">{reviewList[reviewIdx].answer}</div>
          <div style={{fontSize:13,fontWeight:700,color:'var(--gray)',marginBottom:8}}>自己評価</div>
          <div style={{display:'flex',gap:8,justifyContent:'center'}}>
            <button className="btn btn-danger btn-sm" onClick={()=>evalQA(reviewIdx,Math.max(1,reviewList[reviewIdx].understanding-1))}>❌ できなかった</button>
            <button className="btn btn-gray btn-sm" onClick={()=>evalQA(reviewIdx,reviewList[reviewIdx].understanding)}>😐 微妙</button>
            <button className="btn btn-green btn-sm" onClick={()=>evalQA(reviewIdx,Math.min(5,reviewList[reviewIdx].understanding+1))}>✅ できた</button>
          </div>
        </>}
      </div>
      {reviewIdx<reviewList.length-1&&<button className="btn btn-outline" style={{width:'100%',marginTop:10}} onClick={()=>{setShowAns(false);setReviewIdx(i=>i+1)}}>スキップ →</button>}
    </>}
  </div>;

  return <div className="page">
    <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:10}}>
      <div className="section-title" style={{marginBottom:0}}>🎯 Q&A</div>
      <div style={{display:'flex',gap:6}}>
        <button className="btn btn-outline btn-sm" onClick={()=>{setReviewIdx(0);setShowAns(false);setMode('review')}}>復習</button>
        <button className="btn btn-primary btn-sm" onClick={()=>{setEditing({...emptyQA});setMode('form')}}>＋ 追加</button>
      </div>
    </div>
    <div className="search-box">
      <span className="search-icon">🔍</span>
      <input placeholder="検索..." value={filter} onChange={e=>setFilter(e.target.value)}/>
    </div>
    <div className="tab-scroll">
      <button className={`tab-btn${catFilter===''?' active':''}`} onClick={()=>setCatFilter('')}>すべて</button>
      {CATS.map(c=><button key={c} className={`tab-btn${catFilter===c?' active':''}`} onClick={()=>setCatFilter(c)}>{c}</button>)}
    </div>
    {filtered.map(q=><div key={q.id} className="card">
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start'}}>
        <Badge text={q.category}/>
        <span style={{color:q.favorite?'#f59e0b':'#d1d5db',fontSize:16}}>★</span>
      </div>
      <div style={{fontWeight:700,fontSize:14,margin:'4px 0'}}>{q.question}</div>
      <div style={{fontSize:13,color:'#475569',lineHeight:1.5,marginBottom:6}}>{q.answer}</div>
      <StarRating value={q.understanding}/>
      <div className="action-row">
        <button className="btn btn-gray btn-sm" onClick={()=>{setEditing(q);setMode('form')}}>編集</button>
        <button className="btn btn-danger btn-sm" onClick={()=>{if(window.confirm('削除?'))setQA(p=>p.filter(x=>x.id!==q.id))}}>削除</button>
        <CopyBtn text={`Q: ${q.question}\nA: ${q.answer}`}/>
      </div>
    </div>)}
    {filtered.length===0&&<div className="empty"><div className="empty-icon">🎯</div>Q&Aを追加しましょう</div>}
  </div>;
}

function ReflectionTab({reflections,setReflections,setPhrases}){

  const [f,setF]=useState({saw:'',noticed:'',struggled:'',terms:'',tomorrowCheck:''});
  const [result,setResult]=useState(null);
  const set=k=>e=>setF(p=>({...p,[k]:e.target.value}));

  const generate=()=>{
    const r={
      learning:`今日は${f.noticed||f.saw}を経験し、${f.struggled?f.struggled+'という課題に直面しました。':''} ${f.terms?`「${f.terms}」という用語・概念を確認しました。`:''}`,
      insight:f.noticed,
      nextAction:f.tomorrowCheck?`明日は${f.tomorrowCheck}を確認します。`:'明日も安全・品質・Flowを意識して現場に臨みます。',
      phrase:`${f.noticed||f.saw}から学んだこと：現場を見て、事実を確認し、改善につなげることが大切です。`,
    };
    const item={...f,...r,id:uid(),createdAt:new Date().toISOString()};
    setReflections(p=>[item,...p]);
    if(r.phrase) setPhrases(prev=>[{id:uid(),phrase:r.phrase,category:'振り返り回答',scene:'振り返りより',relatedLP:'Dive Deep',favorite:false},...prev]);
    setResult(r);
  };

  if(view==='form') return <div className="page">
    <div style={{display:'flex',justifyContent:'space-between',marginBottom:12}}>
      <div className="section-title" style={{marginBottom:0}}>📅 今日の振り返り</div>
      <button className="btn btn-gray btn-sm" onClick={()=>{setView('list');setResult(null)}}>← 戻る</button>
    </div>
    {!result?<><div className="card">
      <label>今日見たこと・学んだこと</label>
      <textarea placeholder="例：Backlogが増えた工程でPAと確認を行った" value={f.saw} onChange={set('saw')}/>
      <label>気づいたこと</label>
      <textarea placeholder="例：通路の荷物が増える前にPAへ相談する方が対応が早い" value={f.noticed} onChange={set('noticed')}/>
      <label>困ったこと</label>
      <textarea placeholder="例：詰まりの原因特定に時間がかかった" value={f.struggled} onChange={set('struggled')}/>
      <label>聞いた用語・確認したこと</label>
      <input placeholder="例：Stow Rate、HC配置" value={f.terms} onChange={set('terms')}/>
      <label>明日確認したいこと</label>
      <input placeholder="例：Pick & Stageの詰まりやすい時間帯" value={f.tomorrowCheck} onChange={set('tomorrowCheck')}/>
    </div>
    <button className="btn btn-primary" style={{width:'100%'}} onClick={()=>{if(!f.saw&&!f.noticed){alert('学んだことを入力してください');return};generate()}}>振り返りを保存</button>
    </>:<>
      <div className="alert alert-success">✅ 振り返りを保存しました</div>
      {[['📚 今日の学び',result.learning],['💡 現場での気づき',result.insight],['➡️ 次回の行動',result.nextAction],['💬 使える一言',result.phrase]].map(([l,v])=>v&&<div key={l} className="card">
        <div style={{fontWeight:700,fontSize:13,marginBottom:4}}>{l}</div>
        <div style={{fontSize:13,lineHeight:1.6}}>{v}</div>
        <CopyBtn text={v} label="コピー"/>
      </div>)}
    </>}
  </div>;

  return <div className="page">
    <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:10}}>
      <div className="section-title" style={{marginBottom:0}}>📅 振り返り</div>
      <button className="btn btn-primary btn-sm" onClick={()=>{setF({saw:'',noticed:'',struggled:'',terms:'',tomorrowCheck:''});setResult(null);setView('form')}}>＋ 今日の振り返り</button>
    </div>
    {reflections.length===0&&<div className="empty"><div className="empty-icon">📅</div>振り返りを記録しましょう</div>}
    {reflections.map(r=><div key={r.id} className="card">

function PhrasesTab({phrases,setPhrases}){
  const [filter,setFilter]=useState('');
  const [catFilter,setCatFilter]=useState('');
  const [favOnly,setFavOnly]=useState(false);
  const [adding,setAdding]=useState(false);
  const [newPhrase,setNewPhrase]=useState({phrase:'',category:'Safety',scene:'',relatedLP:'',favorite:false});

  const filtered=useMemo(()=>phrases.filter(p=>{
    if(favOnly&&!p.favorite)return false;
    if(catFilter&&p.category!==catFilter)return false;
    const kw=filter.toLowerCase();
    if(!kw)return true;
    return [p.phrase,p.scene,p.relatedLP].some(f=>f&&f.toLowerCase().includes(kw));
  }),[phrases,filter,catFilter,favOnly]);

  return <div className="page">

    {adding&&<div className="card">
      <label>一言 *</label><input value={newPhrase.phrase} onChange={e=>setNewPhrase(p=>({...p,phrase:e.target.value}))} placeholder="使える一言"/>
      <label>カテゴリ</label><select value={newPhrase.category} onChange={e=>setNewPhrase(p=>({...p,category:e.target.value}))}>{CATS.map(c=><option key={c}>{c}</option>)}</select>
      <label>使う場面</label><input value={newPhrase.scene} onChange={e=>setNewPhrase(p=>({...p,scene:e.target.value}))} placeholder="例：朝礼、報告"/>
      <label>関連LP</label><input value={newPhrase.relatedLP} onChange={e=>setNewPhrase(p=>({...p,relatedLP:e.target.value}))} placeholder="例：Ownership"/>
      <div style={{display:'flex',gap:8,marginTop:10}}>
        <button className="btn btn-primary btn-sm" onClick={()=>{if(!newPhrase.phrase)return;setPhrases(p=>[{...newPhrase,id:uid(),favorite:false},...p]);setAdding(false);setNewPhrase({phrase:'',category:'Safety',scene:'',relatedLP:'',favorite:false})}}>保存</button>
        <button className="btn btn-gray btn-sm" onClick={()=>setAdding(false)}>キャンセル</button>
      </div>
    </div>}
    <div className="search-box">
      <span className="search-icon">🔍</span>
      <input placeholder="検索..." value={filter} onChange={e=>setFilter(e.target.value)}/>
    </div>
    <div className="tab-scroll">
      <button className={`tab-btn${catFilter===''?' active':''}`} onClick={()=>setCatFilter('')}>すべて</button>
      {CATS.map(c=><button key={c} className={`tab-btn${catFilter===c?' active':''}`} onClick={()=>setCatFilter(c)}>{c}</button>)}
    </div>
    <button className={`btn btn-sm ${favOnly?'btn-primary':'btn-gray'}`} style={{marginBottom:10}} onClick={()=>setFavOnly(!favOnly)}>⭐ お気に入りのみ</button>
    {filtered.length===0&&<div className="empty"><div className="empty-icon">💬</div>一言を追加しましょう</div>}
    {filtered.map(p=><div key={p.id} className="card" style={{borderLeft:'4px solid #f59e0b'}}>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start'}}>
        <div style={{flex:1,fontSize:14,fontWeight:600,color:'#1e3a5f',lineHeight:1.5}}>「{p.phrase}」</div>
        <button style={{background:'none',border:'none',cursor:'pointer',fontSize:18,color:p.favorite?'#f59e0b':'#d1d5db',flexShrink:0}} onClick={()=>setPhrases(prev=>prev.map(x=>x.id===p.id?{...x,favorite:!x.favorite}:x))}>★</button>

function SearchTab({notes,qa,phrases,fivewhys,improvements}){
  const [query,setQuery]=useState('');
  const results=useMemo(()=>{
    if(!query||query.length<2)return{notes:[],qa:[],phrases:[],fivewhys:[]};
    const kw=query.toLowerCase();
    return {
      notes:notes.filter(n=>[n.term,n.title,n.summary,n.fieldMeaning,n.usefulPhrase,n.experienceNote].some(f=>f&&f.toLowerCase().includes(kw))),
      qa:qa.filter(q=>[q.question,q.answer].some(f=>f&&f.toLowerCase().includes(kw))),
      phrases:phrases.filter(p=>p.phrase?.toLowerCase().includes(kw)),
      fivewhys:fivewhys.filter(w=>[w.event,w.rootCause,w.correctiveAction].some(f=>f&&f.toLowerCase().includes(kw))),
    };
  },[query,notes,qa,phrases,fivewhys]);
  const total=Object.values(results).reduce((s,a)=>s+a.length,0);
  return <div className="page">
    <div className="section-title">🔍 検索</div>
    <div className="search-box">
      <span className="search-icon">🔍</span>
      <input placeholder="キーワードを入力（2文字以上）" value={query} onChange={e=>setQuery(e.target.value)} autoFocus/>
    </div>
    {query.length>=2&&<div style={{fontSize:12,color:'var(--gray)',marginBottom:8}}>{total}件ヒット</div>}
    {results.notes.map(n=><div key={n.id} className="card">
      <div style={{fontSize:11,fontWeight:700,color:'var(--accent)'}}>📒 ノート</div>
      <div style={{fontWeight:700}}>{n.term||n.title}</div>
      <div style={{fontSize:13,color:'#475569'}}>{n.summary}</div>
    </div>)}
    {results.qa.map(q=><div key={q.id} className="card">
      <div style={{fontSize:11,fontWeight:700,color:'#7c3aed'}}>🎯 Q&A</div>
      <div style={{fontWeight:700,fontSize:13}}>{q.question}</div>
      <div style={{fontSize:13,color:'#475569'}}>{q.answer.slice(0,80)}...</div>
    </div>)}
    {results.phrases.map(p=><div key={p.id} className="card">
      <div style={{fontSize:11,fontWeight:700,color:'#f59e0b'}}>💬 一言</div>
      <div style={{fontSize:14,fontStyle:'italic'}}>「{p.phrase}」</div>
    </div>)}
    {results.fivewhys.map(w=><div key={w.id} className="card">
      <div style={{fontSize:11,fontWeight:700,color:'#10b981'}}>🔍 5Why</div>
      <div style={{fontWeight:700,fontSize:13}}>{w.event}</div>
    </div>)}
    {query.length>=2&&total===0&&<div className="empty"><div className="empty-icon">🔍</div>「{query}」の検索結果がありません</div>}
  </div>;
}

function SettingsTab({notes,qa,phrases,fivewhys,improvements,reflections,setNotes,setQA,setPhrases,setFivewhys,setImprovements,setReflections}){
  const exportAll=()=>{
    const data={notes,qa,phrases,fivewhys,improvements,reflections,exportedAt:new Date().toISOString()};
    const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
    const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`ds-musou-note-${Date.now()}.json`;a.click();
  };
  const exportCSV=(arr,filename)=>{
    if(!arr.length)return;
    const keys=Object.keys(arr[0]);
    const csv=[keys.join(','),...arr.map(r=>keys.map(k=>`"${(r[k]||'').toString().replace(/"/g,'""')}"`).join(','))].join('\n');
    const blob=new Blob(['﻿'+csv],{type:'text/csv'});
    const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`${filename}-${Date.now()}.csv`;a.click();
  };
  const importFile=()=>{
    const input=document.createElement('input');input.type='file';input.accept='.json';
    input.onchange=e=>{
      const file=e.target.files[0];if(!file)return;
      const reader=new FileReader();
      reader.onload=ev=>{
        try{
          const data=JSON.parse(ev.target.result);
          if(window.confirm('データをインポートします。既存データは上書きされます。続けますか？')){
            if(data.notes)setNotes(data.notes);
            if(data.qa)setQA(data.qa);
            if(data.phrases)setPhrases(data.phrases);
            if(data.fivewhys)setFivewhys(data.fivewhys);
            if(data.improvements)setImprovements(data.improvements);
            if(data.reflections)setReflections(data.reflections);
            alert('インポート完了しました');
          }
        }catch{alert('ファイルの読み込みに失敗しました')}
      };
      reader.readAsText(file);
    };
    input.click();
  };
  const loadSample=()=>{
    if(window.confirm('サンプルデータを再読み込みします。現在のノートに追加されます。続けますか？')){
      setNotes(p=>{const ids=new Set(p.map(n=>n.id));return[...p,...SAMPLE_NOTES.filter(n=>!ids.has(n.id))];});
      setQA(p=>{const ids=new Set(p.map(q=>q.id));return[...p,...SAMPLE_QA.filter(q=>!ids.has(q.id))];});
      setPhrases(p=>{const ids=new Set(p.map(x=>x.id));return[...p,...SAMPLE_PHRASES.filter(x=>!ids.has(x.id))];});
      alert('サンプルデータを追加しました');
    }
  };
  const resetAll=()=>{
    if(window.confirm('全データを削除します。この操作は取り消せません。本当に削除しますか？')){
      [SK.notes,SK.qa,SK.phrases,SK.fivewhys,SK.improvements,SK.reflections].forEach(k=>localStorage.removeItem(k));
      setNotes([]);setQA([]);setPhrases([]);setFivewhys([]);setImprovements([]);setReflections([]);
      alert('リセットしました');
    }
  };
  return <div className="page">
    <div className="section-title">⚙️ 設定</div>
    <div className="card">
      <div className="card-title">📤 エクスポート</div>
      <div style={{display:'flex',gap:8,flexWrap:'wrap'}}>
        <button className="btn btn-outline btn-sm" onClick={exportAll}>💾 全データをJSONで保存</button>
        <button className="btn btn-outline btn-sm" onClick={()=>exportCSV(notes,'notes')}>📒 ノートCSV</button>
        <button className="btn btn-outline btn-sm" onClick={()=>exportCSV(qa,'qa')}>🎯 Q&A CSV</button>
        <button className="btn btn-outline btn-sm" onClick={()=>exportCSV(phrases,'phrases')}>💬 一言CSV</button>
      </div>
    </div>
    <div className="card">
      <div className="card-title">📥 インポート</div>
      <button className="btn btn-outline btn-sm" onClick={importFile}>📂 JSONファイルをインポート</button>
      <div style={{fontSize:12,color:'var(--gray)',marginTop:6}}>※エクスポートしたJSONファイルをインポートできます</div>
    </div>
    <div className="card">
      <div className="card-title">🔄 サンプルデータ</div>
      <button className="btn btn-outline btn-sm" onClick={loadSample}>サンプルデータを再読み込み</button>
    </div>
    <div className="card">
      <div className="card-title" style={{color:'var(--red)'}}>⚠️ データリセット</div>
      <div style={{fontSize:13,color:'var(--gray)',marginBottom:8}}>全データを削除します。必ずバックアップを取ってから実行してください。</div>
      <button className="btn btn-danger btn-sm" onClick={resetAll}>全データを削除</button>
    </div>
    <div className="card">
      <div className="card-title">ℹ️ このアプリについて</div>
      <div style={{fontSize:13,color:'#475569',lineHeight:1.7}}>
        <strong>トレーニングノート</strong><br/>
        Amazon DSで働く新任エリアマネージャーのための学習・実務支援ツール。<br/>
        データはすべてブラウザのlocalStorageに保存されます。<br/><br/>
        <strong>使い始め方：</strong><br/>
        1. ノートタブで用語・学びを記録<br/>
        2. Q&Aで復習モードを活用<br/>
        3. AI相談でプロンプトを生成<br/>
        4. 5Whyで事象を深掘り<br/>
        5. 改善アクションで対策を整理<br/>
        6. 朝礼共有で現場に落とし込む
      </div>
    </div>
  </div>;
}

  const [improvements,setImprovementsRaw]=useState(()=>load(SK.improvements,[]));
  const [reflections,setReflectionsRaw]=useState(()=>load(SK.reflections,[]));

  const setNotes=v=>{setNotesRaw(v);save(SK.notes,typeof v==='function'?v(notes):v)};
  const setQA=v=>{setQARaw(v);save(SK.qa,typeof v==='function'?v(qa):v)};
  const setPhrases=v=>{setPhrasesRaw(v);save(SK.phrases,typeof v==='function'?v(phrases):v)};

  const setReflections=v=>{setReflectionsRaw(v);save(SK.reflections,typeof v==='function'?v(reflections):v)};

  // persist on change
  useEffect(()=>save(SK.notes,notes),[notes]);
  useEffect(()=>save(SK.qa,qa),[qa]);
  useEffect(()=>save(SK.phrases,phrases),[phrases]);
  useEffect(()=>save(SK.fivewhys,fivewhys),[fivewhys]);
  useEffect(()=>save(SK.improvements,improvements),[improvements]);
  useEffect(()=>save(SK.reflections,reflections),[reflections]);

  const goTab=t=>{setTab(t);setShowMenu(false);window.scrollTo(0,0)};

  const tabLabel = NAV_ITEMS.find(n=>n.key===tab);

  return <>
    <div className="app-header">

      <span style={{fontSize:13,opacity:.8}}>{tabLabel?.icon} {tabLabel?.label}</span>

    {tab==='improvement'&&<ImprovementTab improvements={improvements} setImprovements={setImprovements} setPhrases={setPhrases}/>}
    {tab==='morning'&&<MorningBriefTab/>}
    {tab==='reflection'&&<ReflectionTab reflections={reflections} setReflections={setReflections} setPhrases={setPhrases}/>}
    {tab==='phrases'&&<PhrasesTab phrases={phrases} setPhrases={setPhrases}/>}
    {tab==='search'&&<SearchTab notes={notes} qa={qa} phrases={phrases} fivewhys={fivewhys} improvements={improvements}/>}
    {tab==='settings'&&<SettingsTab notes={notes} qa={qa} phrases={phrases} fivewhys={fivewhys} improvements={improvements} reflections={reflections} setNotes={setNotes} setQA={setQA} setPhrases={setPhrases} setFivewhys={setFivewhys} setImprovements={setImprovements} setReflections={setReflections}/>}

    {/* Menu modal */}
    {showMenu&&<div className="modal-overlay" onClick={()=>setShowMenu(false)}>
      <div className="modal" onClick={e=>e.stopPropagation()}>
        <div className="modal-title">メニュー</div>
        <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:8}}>
          {NAV_ITEMS.filter(n=>n.key!=='dashboard').map(n=><button key={n.key} className="btn btn-outline" style={{justifyContent:'flex-start',gap:8}} onClick={()=>goTab(n.key)}>
            <span style={{fontSize:18}}>{n.icon}</span>{n.label}
          </button>)}
        </div>
      </div>
    </div>}

    <nav className="bottom-nav">
      {MAIN_NAV.map(n=><button key={n.key} className={tab===n.key?'active':''} onClick={()=>n.key==='more'?setShowMenu(!showMenu):goTab(n.key)}>
        <span style={{fontSize:20}}>{n.icon}</span>
        <span>{n.label}</span>
      </button>)}
    </nav>
  </>;
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
